name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: unzip OreOverlay.zip
      - run: gradle assembleDebug --no-daemon
        working-directory: OreOverlay
      - uses: actions/upload-artifact@v4
        with:
          name: OreOverlay-apk
          path: OreOverlay/app/build/outputs/apk/debug/app-debug.apk
